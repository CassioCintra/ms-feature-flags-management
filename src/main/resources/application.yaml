#file: noinspection YAMLSchemaValidation,SpellCheckingInspection
spring:
  application:
    name: ms-feature-flags-management
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ms_feature_flags_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI:http://localhost:9000}
      client:
        registration:
          consul:
            provider: ms-auth
            client-id: ${CONSUL_CLIENT_ID:ms-feature-flags-management}
            client-secret: ${CONSUL_CLIENT_SECRET:ms-feature-flags-management-secret}
            authorization-grant-type: client_credentials
            scope: flags:write
        provider:
          ms-auth:
            token-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI:http://localhost:9000}/oauth2/token
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAPSERVERS:localhost:9094}

feature-flag:
  environments: ${FEATURE_FLAG_ENVIRONMENTS:dev,hml,prod}
  consul:
    url: ${CONSUL_URL:http://localhost:8500}
    auth-method: ms-auth
    client-registration-id: consul
    reconcile-interval: ${CONSUL_RECONCILE_INTERVAL:60s}
  kafka:
    relay-interval: ${KAFKA_RELAY_INTERVAL:1s}
    topics:
      flags: flag.events

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlator}] %-5level %logger{0} - %msg%n"
  level:
    cassio.featureflags: DEBUG

info:
  app:
    version: "@project.version@"

server:
  port: 8081
  servlet:
    context-path: /feature-flag/v1